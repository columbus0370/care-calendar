<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>介護サービス希望カレンダー</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; background: #F0F4F8; }
    button { font-family: inherit; }
    textarea, input, select { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const SERVICES = {
      short: { label: "ショートステイ", color: "#3B82F6", bg: "#DBEAFE", short: "S" },
      day:   { label: "デイサービス",   color: "#10B981", bg: "#D1FAE5", short: "D" },
    };
    const SERVICE_CYCLE = ["short", "day", null];

    function formatDateKey(year, month, day) {
      return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    }
    function parseKey(key) {
      const [y, m, d] = key.split("-").map(Number);
      return { year: y, month: m - 1, day: d };
    }
    function getMonthDays(year, month) {
      return {
        firstDay: new Date(year, month, 1).getDay(),
        totalDays: new Date(year, month + 1, 0).getDate(),
      };
    }
    function keyToDate(key) {
      const { year, month, day } = parseKey(key);
      return new Date(year, month, day);
    }
    function getRangeBetween(keyA, keyB) {
      const a = keyToDate(keyA), b = keyToDate(keyB);
      const [from, to] = a <= b ? [a, b] : [b, a];
      const keys = [];
      const cur = new Date(from);
      while (cur <= to) {
        keys.push(formatDateKey(cur.getFullYear(), cur.getMonth(), cur.getDate()));
        cur.setDate(cur.getDate() + 1);
      }
      return keys;
    }

    const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

    function DayPopup({ startKey, onApply, onClose, onPreview }) {
      const { year, month, day } = parseKey(startKey);
      const [service, setService] = useState(null);
      const [endKey, setEndKey] = useState(startKey);
      const [memo, setMemo] = useState("");

      const { totalDays } = getMonthDays(year, month);
      const endDays = Array.from({ length: totalDays }, (_, i) => i + 1)
        .filter((d) => keyToDate(formatDateKey(year, month, d)) >= keyToDate(startKey));

      const handleSelectEnd = (k) => {
        setEndKey(k);
        onPreview({ startKey, endKey: k, service });
      };
      const handleSelectService = (k) => {
        setService(k);
        onPreview({ startKey, endKey, service: k });
      };
      const handleApply = () => {
        if (!service) return;
        onApply({ startKey, endKey, service, memo });
      };
      const handleClose = () => {
        onPreview(null);
        onClose();
      };

      return (
        <div style={{
          position: "fixed", inset: 0, zIndex: 200,
          background: "rgba(0,0,0,0.45)", display: "flex", alignItems: "flex-end", justifyContent: "center"
        }} onClick={handleClose}>
          <div onClick={(e) => e.stopPropagation()} style={{
            background: "white", borderRadius: "20px 20px 0 0", padding: "20px 20px 32px",
            width: "100%", maxWidth: 480, boxShadow: "0 -8px 32px rgba(0,0,0,0.15)",
            maxHeight: "80vh", overflowY: "auto"
          }}>
            <div style={{ fontSize: 15, fontWeight: 800, color: "#1E40AF", marginBottom: 16 }}>
              📅 {month + 1}月{day}日 から入力
            </div>

            <div style={{ fontSize: 12, color: "#64748B", marginBottom: 6 }}>サービス種別</div>
            <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
              {Object.entries(SERVICES).map(([k, s]) => (
                <button key={k} onClick={() => handleSelectService(k)} style={{
                  flex: 1, padding: "12px 4px", borderRadius: 12, border: "2px solid",
                  borderColor: service === k ? s.color : "#E2E8F0",
                  background: service === k ? s.bg : "white",
                  color: service === k ? s.color : "#94A3B8",
                  fontWeight: 700, fontSize: 13, cursor: "pointer"
                }}>{s.label}</button>
              ))}
            </div>

            <div style={{ fontSize: 12, color: "#64748B", marginBottom: 6 }}>
              終了日を選択
              {service && (
                <span style={{ marginLeft: 8, color: SERVICES[service].color, fontWeight: 700 }}>
                  （カレンダーにプレビュー表示中）
                </span>
              )}
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 16 }}>
              {endDays.map((d) => {
                const k = formatDateKey(year, month, d);
                const sel = k === endKey;
                const inRange = service && getRangeBetween(startKey, endKey).includes(k);
                const svc = service ? SERVICES[service] : null;
                return (
                  <button key={d} onClick={() => handleSelectEnd(k)} style={{
                    width: 40, height: 40, borderRadius: 10, border: "2px solid",
                    borderColor: sel ? "#1E40AF" : inRange && svc ? svc.color : "#E2E8F0",
                    background: sel ? "#1E40AF" : inRange && svc ? svc.bg : "#F8FAFC",
                    color: sel ? "white" : inRange && svc ? svc.color : "#334155",
                    fontWeight: 700, fontSize: 13, cursor: "pointer", transition: "all 0.1s"
                  }}>{d}</button>
                );
              })}
            </div>

            <div style={{ fontSize: 12, color: "#64748B", marginBottom: 6 }}>📝 この予定の備考（任意）</div>
            <textarea
              value={memo}
              onChange={(e) => setMemo(e.target.value)}
              placeholder="例：送迎は午前希望、持ち物：バスタオル"
              rows={2}
              style={{ width: "100%", padding: "10px 12px", border: "1.5px solid #E2E8F0", borderRadius: 10, fontSize: 13, resize: "none", outline: "none", marginBottom: 16 }}
            />

            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={handleClose} style={{
                flex: 1, padding: 14, borderRadius: 14, border: "2px solid #E2E8F0",
                background: "white", color: "#94A3B8", fontWeight: 700, fontSize: 14, cursor: "pointer"
              }}>キャンセル</button>
              <button onClick={handleApply} style={{
                flex: 2, padding: 14, borderRadius: 14, border: "none",
                background: service ? "linear-gradient(135deg,#1E40AF,#3B82F6)" : "#E2E8F0",
                color: service ? "white" : "#94A3B8", fontWeight: 800, fontSize: 14, cursor: service ? "pointer" : "default"
              }}>✅ 登録する</button>
            </div>
          </div>
        </div>
      );
    }

    function CareCalendar() {
      const today = new Date();
      const [startYear, setStartYear] = useState(today.getFullYear());
      const [startMonth, setStartMonth] = useState(today.getMonth());
      const [userName, setUserName] = useState("");
      const [schedule, setSchedule] = useState({});
      const [entries, setEntries] = useState([]);
      const [popup, setPopup] = useState(null);
      const [preview, setPreview] = useState(null);
      const [outputText, setOutputText] = useState("");
      const [copied, setCopied] = useState(false);
      const [screen, setScreen] = useState("input");

      const months = [0, 1, 2].map((i) => {
        const m = (startMonth + i) % 12;
        const y = startYear + Math.floor((startMonth + i) / 12);
        return { year: y, month: m };
      });

      const previewKeys = preview && preview.service
        ? new Set(getRangeBetween(preview.startKey, preview.endKey))
        : new Set();

      const handleDayTap = (key) => {
        if (popup) return;
        const cur = schedule[key];
        const idx = SERVICE_CYCLE.indexOf(cur ?? null);
        const next = SERVICE_CYCLE[(idx + 1) % SERVICE_CYCLE.length];
        if (next === null) {
          setSchedule((prev) => { const n = { ...prev }; delete n[key]; return n; });
          setEntries((prev) => prev.filter((e) => !getRangeBetween(e.startKey, e.endKey).includes(key)));
        } else {
          setPopup(key);
        }
      };

      const handlePopupApply = ({ startKey, endKey, service, memo }) => {
        const range = getRangeBetween(startKey, endKey);
        setSchedule((prev) => {
          const next = { ...prev };
          range.forEach((k) => { next[k] = service; });
          return next;
        });
        setEntries((prev) => [...prev, { id: Date.now(), startKey, endKey, service, memo }]);
        setPreview(null);
        setPopup(null);
      };

      const handleDeleteEntry = (id) => {
        const entry = entries.find((e) => e.id === id);
        if (!entry) return;
        getRangeBetween(entry.startKey, entry.endKey).forEach((k) => {
          setSchedule((prev) => { const n = { ...prev }; delete n[k]; return n; });
        });
        setEntries((prev) => prev.filter((e) => e.id !== id));
      };

      const handleUpdateMemo = (id, memo) => {
        setEntries((prev) => prev.map((e) => e.id === id ? { ...e, memo } : e));
      };

      function generateText() {
        const lines = [];
        const header = userName ? `【介護サービス希望】${userName}様` : "【介護サービス希望】";
        const mRange = months.map((m) => `${m.month + 1}月`).join("〜");
        lines.push(header);
        lines.push(`対象期間：${months[0].year}年${mRange}`);
        lines.push("");
        months.forEach(({ year, month }) => {
          const { totalDays } = getMonthDays(year, month);
          const shortDays = [], dayDays = [];
          for (let d = 1; d <= totalDays; d++) {
            const key = formatDateKey(year, month, d);
            if (schedule[key] === "short") shortDays.push(d);
            if (schedule[key] === "day") dayDays.push(d);
          }
          const fmt = (days) => {
            if (!days.length) return "なし";
            const r = []; let s = days[0], e = days[0];
            for (let i = 1; i < days.length; i++) {
              if (days[i] === e + 1) e = days[i];
              else { r.push(s === e ? `${s}日` : `${s}日〜${e}日`); s = e = days[i]; }
            }
            r.push(s === e ? `${s}日` : `${s}日〜${e}日`);
            return r.join("、");
          };
          lines.push(`■${month + 1}月`);
          lines.push(`・ショートステイ：${fmt(shortDays)}`);
          lines.push(`・デイサービス：${fmt(dayDays)}`);
          entries.filter((e) => {
            const { month: em, year: ey } = parseKey(e.startKey);
            return ey === year && em === month && e.memo;
          }).forEach((e) => {
            const { day: sd } = parseKey(e.startKey);
            const { day: ed } = parseKey(e.endKey);
            const rangeStr = sd === ed ? `${sd}日` : `${sd}日〜${ed}日`;
            lines.push(`・備考（${SERVICES[e.service].label} ${rangeStr}）：${e.memo}`);
          });
          lines.push("");
        });
        return lines.join("\n");
      }

      const handleGenerate = () => { setOutputText(generateText()); setScreen("output"); };
      const handleCopy = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(outputText).then(() => {
            setCopied(true); setTimeout(() => setCopied(false), 2000);
          });
        } else {
          // fallback for older browsers
          const ta = document.createElement("textarea");
          ta.value = outputText;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          setCopied(true); setTimeout(() => setCopied(false), 2000);
        }
      };

      return (
        <div style={{ fontFamily: "'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif", minHeight: "100vh", background: "#F0F4F8" }}>
          <div style={{ background: "linear-gradient(135deg,#1E40AF,#3B82F6)", padding: "20px 16px 16px", color: "white" }}>
            <div style={{ fontSize: 20, fontWeight: 700, letterSpacing: 1 }}>📅 介護サービス希望カレンダー</div>
            <div style={{ fontSize: 12, opacity: 0.85, marginTop: 4 }}>ケアマネさんへの予定共有ツール</div>
          </div>

          {screen === "input" ? (
            <div style={{ padding: 16, maxWidth: 480, margin: "0 auto" }}>

              <div style={{ background: "white", borderRadius: 16, padding: 16, marginBottom: 16, boxShadow: "0 2px 8px rgba(0,0,0,0.08)" }}>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#1E40AF", marginBottom: 12 }}>⚙️ 基本設定</div>
                <div style={{ marginBottom: 12 }}>
                  <label style={{ fontSize: 12, color: "#64748B", display: "block", marginBottom: 4 }}>利用者名（任意）</label>
                  <input value={userName} onChange={(e) => setUserName(e.target.value)} placeholder="例：山田 太郎"
                    style={{ width: "100%", padding: "10px 12px", border: "1.5px solid #E2E8F0", borderRadius: 10, fontSize: 15, outline: "none" }} />
                </div>
                <div>
                  <label style={{ fontSize: 12, color: "#64748B", display: "block", marginBottom: 4 }}>開始月</label>
                  <div style={{ display: "flex", gap: 8 }}>
                    <select value={startYear} onChange={(e) => setStartYear(Number(e.target.value))}
                      style={{ flex: 1, padding: "10px 8px", border: "1.5px solid #E2E8F0", borderRadius: 10, fontSize: 15 }}>
                      {[today.getFullYear(), today.getFullYear() + 1].map((y) => <option key={y} value={y}>{y}年</option>)}
                    </select>
                    <select value={startMonth} onChange={(e) => setStartMonth(Number(e.target.value))}
                      style={{ flex: 1, padding: "10px 8px", border: "1.5px solid #E2E8F0", borderRadius: 10, fontSize: 15 }}>
                      {Array.from({ length: 12 }, (_, i) => <option key={i} value={i}>{i + 1}月</option>)}
                    </select>
                  </div>
                </div>
              </div>

              <div style={{ background: "#EFF6FF", borderRadius: 12, padding: "10px 14px", marginBottom: 16, border: "1.5px solid #BFDBFE" }}>
                <div style={{ fontSize: 12, color: "#1E40AF", fontWeight: 700, marginBottom: 4 }}>📖 操作方法</div>
                <div style={{ fontSize: 12, color: "#3B82F6", lineHeight: 1.8 }}>
                  • 日付をタップ → サービス・終了日・備考を入力<br />
                  • 終了日を選ぶとカレンダーがリアルタイムで色づきます<br />
                  • 登録済みの日をタップ → 種別切替（ショート→デイ→クリア）
                </div>
              </div>

              {months.map(({ year, month }) => {
                const { firstDay, totalDays } = getMonthDays(year, month);
                const monthKey = `${year}-${month}`;
                const monthEntries = entries.filter((e) => {
                  const { month: em, year: ey } = parseKey(e.startKey);
                  return ey === year && em === month;
                });

                return (
                  <div key={monthKey} style={{ background: "white", borderRadius: 16, padding: 16, marginBottom: 16, boxShadow: "0 2px 8px rgba(0,0,0,0.08)" }}>
                    <div style={{ fontSize: 16, fontWeight: 800, color: "#1E40AF", marginBottom: 12 }}>{year}年 {month + 1}月</div>

                    <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 2, marginBottom: 4 }}>
                      {WEEKDAYS.map((w, i) => (
                        <div key={w} style={{ textAlign: "center", fontSize: 11, fontWeight: 700, color: i === 0 ? "#EF4444" : i === 6 ? "#3B82F6" : "#64748B", padding: "4px 0" }}>{w}</div>
                      ))}
                    </div>

                    <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 2 }}>
                      {Array.from({ length: firstDay }).map((_, i) => <div key={`e${i}`} />)}
                      {Array.from({ length: totalDays }, (_, i) => i + 1).map((day) => {
                        const key = formatDateKey(year, month, day);
                        const svc = schedule[key];
                        const isPreview = previewKeys.has(key);
                        const previewSvc = isPreview && preview && preview.service ? SERVICES[preview.service] : null;
                        const dow = (firstDay + day - 1) % 7;
                        const isSun = dow === 0, isSat = dow === 6;
                        const dispSvc = svc ? SERVICES[svc] : null;
                        const bg = isPreview && previewSvc ? previewSvc.bg : dispSvc ? dispSvc.bg : "#F8FAFC";
                        const borderColor = isPreview && previewSvc ? previewSvc.color : dispSvc ? dispSvc.color : "#E2E8F0";
                        const borderStyle = isPreview && !svc ? "dashed" : "solid";

                        return (
                          <div key={day} onClick={() => handleDayTap(key)} style={{
                            height: 44, borderRadius: 10, display: "flex", flexDirection: "column",
                            alignItems: "center", justifyContent: "center", cursor: "pointer",
                            background: bg, border: `2px ${borderStyle} ${borderColor}`,
                            transition: "all 0.1s", opacity: isPreview && !svc ? 0.75 : 1,
                          }}>
                            <span style={{ fontSize: 13, fontWeight: 700, color: isSun ? "#EF4444" : isSat ? "#3B82F6" : "#334155" }}>{day}</span>
                            {(svc || (isPreview && previewSvc)) && (
                              <span style={{ fontSize: 9, fontWeight: 700, color: isPreview && previewSvc ? previewSvc.color : dispSvc && dispSvc.color }}>
                                {isPreview && previewSvc ? previewSvc.short : dispSvc && dispSvc.short}
                              </span>
                            )}
                          </div>
                        );
                      })}
                    </div>

                    <div style={{ display: "flex", gap: 12, marginTop: 10, flexWrap: "wrap" }}>
                      {Object.entries(SERVICES).map(([k, s]) => (
                        <div key={k} style={{ display: "flex", alignItems: "center", gap: 4 }}>
                          <div style={{ width: 12, height: 12, borderRadius: 3, background: s.bg, border: `2px solid ${s.color}` }} />
                          <span style={{ fontSize: 11, color: "#64748B" }}>{s.label}</span>
                        </div>
                      ))}
                      {previewKeys.size > 0 && (
                        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                          <div style={{ width: 12, height: 12, borderRadius: 3, background: "#F8FAFC", border: "2px dashed #94A3B8" }} />
                          <span style={{ fontSize: 11, color: "#94A3B8" }}>入力中</span>
                        </div>
                      )}
                    </div>

                    {monthEntries.length > 0 && (
                      <div style={{ marginTop: 14 }}>
                        <div style={{ fontSize: 12, color: "#64748B", fontWeight: 700, marginBottom: 8 }}>📝 この月の予定一覧・備考</div>
                        {monthEntries.map((entry) => {
                          const { day: sd } = parseKey(entry.startKey);
                          const { day: ed } = parseKey(entry.endKey);
                          const s = SERVICES[entry.service];
                          const rangeStr = sd === ed ? `${sd}日` : `${sd}〜${ed}日`;
                          return (
                            <div key={entry.id} style={{ background: s.bg, borderRadius: 10, padding: "10px 12px", marginBottom: 8, border: `1.5px solid ${s.color}` }}>
                              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                                <span style={{ fontSize: 13, fontWeight: 700, color: s.color }}>{s.label}｜{rangeStr}</span>
                                <button onClick={() => handleDeleteEntry(entry.id)} style={{ background: "none", border: "none", color: "#EF4444", fontSize: 18, cursor: "pointer", lineHeight: 1, padding: "0 4px" }}>×</button>
                              </div>
                              <textarea value={entry.memo} onChange={(e) => handleUpdateMemo(entry.id, e.target.value)}
                                placeholder="備考を入力（任意）" rows={2}
                                style={{ width: "100%", padding: "8px 10px", border: "1.5px solid #CBD5E1", borderRadius: 8, fontSize: 12, resize: "none", outline: "none", background: "white" }} />
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}

              <button onClick={handleGenerate} style={{
                width: "100%", padding: 16, borderRadius: 16, border: "none",
                background: "linear-gradient(135deg,#1E40AF,#3B82F6)", color: "white",
                fontSize: 16, fontWeight: 800, cursor: "pointer", boxShadow: "0 4px 16px rgba(59,130,246,0.4)", marginBottom: 32
              }}>📤 テキストを生成する</button>
            </div>
          ) : (
            <div style={{ padding: 16, maxWidth: 480, margin: "0 auto" }}>
              <div style={{ background: "white", borderRadius: 16, padding: 16, marginBottom: 16, boxShadow: "0 2px 8px rgba(0,0,0,0.08)" }}>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#1E40AF", marginBottom: 12 }}>📋 送信用テキスト</div>
                <textarea value={outputText} onChange={(e) => setOutputText(e.target.value)} rows={20}
                  style={{ width: "100%", padding: 12, border: "1.5px solid #E2E8F0", borderRadius: 10, fontSize: 13, lineHeight: 1.8, resize: "vertical", fontFamily: "monospace", color: "#334155", outline: "none" }} />
              </div>
              <button onClick={handleCopy} style={{
                width: "100%", padding: 16, borderRadius: 16, border: "none",
                background: copied ? "linear-gradient(135deg,#059669,#10B981)" : "linear-gradient(135deg,#1E40AF,#3B82F6)",
                color: "white", fontSize: 16, fontWeight: 800, cursor: "pointer",
                boxShadow: "0 4px 16px rgba(59,130,246,0.4)", marginBottom: 12, transition: "background 0.3s"
              }}>{copied ? "✅ コピーしました！" : "📋 テキストをコピー"}</button>
              <button onClick={() => setScreen("input")} style={{
                width: "100%", padding: 14, borderRadius: 16, border: "2px solid #E2E8F0",
                background: "white", color: "#64748B", fontSize: 15, fontWeight: 700, cursor: "pointer", marginBottom: 32
              }}>← カレンダーに戻る</button>
            </div>
          )}

          {popup && (
            <DayPopup
              startKey={popup}
              onApply={handlePopupApply}
              onClose={() => { setPreview(null); setPopup(null); }}
              onPreview={setPreview}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<CareCalendar />);
  </script>
</body>
</html>
